databases:
  - name: nexivoreach-db
    plan: free
    databaseName: nexivoreach
    user: nexivoreach

services:
  - type: web
    name: nexivoreach
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      # Cloudflare Worker relay for hosts that firewall Render's egress IPs.
      - key: SCRAPE_PROXY_URL
        sync: false
      - key: SCRAPE_PROXY_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Live multi-device data: managed Postgres (not ephemeral SQLite).
      - key: DATABASE_URL
        fromDatabase:
          name: nexivoreach-db
          property: connectionString
      - key: PYTHON_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: INVITE_ONLY
        value: "true"
      - key: DAILY_HUNT_LIMIT
        value: "5"
      - key: DAILY_EXTRACT_LIMIT
        value: "10"
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON
        sync: false
